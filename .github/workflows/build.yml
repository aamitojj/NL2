name: Build HostPanel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o hostpanel.exe .

      - name: Checksum
        run: sha256sum hostpanel.exe | tee hostpanel.exe.sha256

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: hostpanel-windows
          path: |
            hostpanel.exe
            hostpanel.exe.sha256

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hostpanel.exe
            hostpanel.exe.sha256
