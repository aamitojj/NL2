name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Decode icons
        shell: bash
        run: for f in web/icon.png winres/icon.ico winres/icon.png; do tr -d "\r" < "$f.b64" | base64 -d > "$f"; done
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Decode icons
        shell: bash
        run: for f in web/icon.png winres/icon.ico winres/icon.png; do tr -d "\r" < "$f.b64" | base64 -d > "$f"; done
      - name: Windows resources (icon, manifest)
        shell: bash
        run: go run github.com/tc-hib/go-winres@latest make --in winres/winres.json --product-version "${GITHUB_REF_NAME#v}" --file-version "${GITHUB_REF_NAME#v}" || go run github.com/tc-hib/go-winres@latest make --in winres/winres.json
      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.4.0"
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Build dilreet.exe
        shell: bash
        env: { GOOS: windows, GOARCH: amd64, CGO_ENABLED: "0" }
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=$VER" -o dilreet.exe .
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=$env:VER" installer\dilreet.iss
      - name: Checksums
        shell: bash
        run: sha256sum dilreet.exe dist/Dilreet-Setup-*.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dilreet-${{ env.VER }}
          path: |
            dilreet.exe
            dist/Dilreet-Setup-*.exe
            SHA256SUMS.txt
