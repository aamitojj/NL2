name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Decode binary assets
        shell: bash
        run: |
          tr -d "\r" < assets/web_icon.png.b64 | base64 -d > web/icon.png
          tr -d "\r" < assets/winres_icon.ico.b64 | base64 -d > winres/icon.ico
          tr -d "\r" < assets/winres_icon.png.b64 | base64 -d > winres/icon.png
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Decode binary assets
        shell: bash
        run: |
          tr -d "\r" < assets/web_icon.png.b64 | base64 -d > web/icon.png
          tr -d "\r" < assets/winres_icon.ico.b64 | base64 -d > winres/icon.ico
          tr -d "\r" < assets/winres_icon.png.b64 | base64 -d > winres/icon.png
      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.3.0"
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Generate icon/version resource (go-winres)
        shell: bash
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --out rsrc
      - name: Build dilreet.exe
        shell: bash
        env: { GOOS: windows, GOARCH: amd64, CGO_ENABLED: "0" }
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=$VER" -o dilreet.exe .
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=$env:VER" installer\dilreet.iss
      - name: Checksums
        shell: bash
        run: sha256sum dilreet.exe dist/Dilreet-Setup-*.exe > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dilreet-${{ env.VER }}
          path: |
            dilreet.exe
            dist/Dilreet-Setup-*.exe
            SHA256SUMS.txt
